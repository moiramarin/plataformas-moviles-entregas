<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Tablero de Puntos - DOM y JavaScript</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container my-4">

        <h1>Tablero de Puntos</h1>

        <div class="card">
            <div class="card-body">

                <!-- TABLERO -->

                <div class="row text-center">

                    <div class="col-5">

                        <span id="puntajeLocal"
                              class="display-1">
                            0
                        </span>

                        <p id="nombreLocal"
                           class="m-0 fs-4">
                            Local
                        </p>

                    </div>


                    <div class="col-2">

                        <span class="display-1">
                            :
                        </span>

                    </div>


                    <div class="col-5">

                        <span id="puntajeVisitante"
                              class="display-1">
                            0
                        </span>

                        <p id="nombreVisitante"
                           class="m-0 fs-4">
                            Visitante
                        </p>

                    </div>

                </div>


                <hr>


                <!-- BOTONES -->

                <h2>Actualizar Contador</h2>

                <div class="row">

                    <div class="col-12 col-sm-6 my-1">

                        <button
                            onclick="sumarLocal()"
                            class="btn btn-primary d-block w-100">

                            + Punto Local

                        </button>

                    </div>


                    <div class="col-12 col-sm-6 my-1">

                        <button
                            onclick="restarLocal()"
                            class="btn btn-secondary d-block w-100">

                            - Punto Local

                        </button>

                    </div>


                    <div class="col-12 col-sm-6 my-1">

                        <button
                            onclick="sumarVisitante()"
                            class="btn btn-primary d-block w-100">

                            + Punto Visitante

                        </button>

                    </div>


                    <div class="col-12 col-sm-6 my-1">

                        <button
                            onclick="restarVisitante()"
                            class="btn btn-secondary d-block w-100">

                            - Punto Visitante

                        </button>

                    </div>

                </div>


                <hr>


                <!-- ACCIONES -->

                <h2>Acciones</h2>

                <div class="row">

                    <div class="col-12 col-sm-4 my-1">

                        <button
                            onclick="invertirPuntaje()"
                            id="btnInvertir"
                            class="btn btn-warning d-block w-100">

                            Invertir Puntaje

                        </button>

                    </div>


                    <div class="col-12 col-sm-4 my-1">

                        <button
                            onclick="finalizarPartido()"
                            id="btnFinalizar"
                            class="btn btn-dark d-block w-100">

                            Finalizar Partido

                        </button>

                    </div>


                    <div class="col-12 col-sm-4 my-1">

                        <button
                            onclick="reiniciar()"
                            class="btn btn-danger d-block w-100">

                            Reinicio

                        </button>

                    </div>

                </div>


                <hr>


                <!-- CAMBIAR NOMBRES -->

                <h2>Personalización</h2>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">
                            Nombre Local
                        </label>

                        <input
                            id="inputLocal"
                            type="text"
                            class="form-control"
                            oninput="cambiarNombreLocal()">

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Nombre Visitante
                        </label>

                        <input
                            id="inputVisitante"
                            type="text"
                            class="form-control"
                            oninput="cambiarNombreVisitante()">

                    </div>

                </div>


                <br>


                <!-- COLORES -->

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">
                            Color Local
                        </label>

                        <input
                            id="colorLocal"
                            type="color"
                            value="#0d6efd"
                            onchange="cambiarColorLocal()">

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Color Visitante
                        </label>

                        <input
                            id="colorVisitante"
                            type="color"
                            value="#dc3545"
                            onchange="cambiarColorVisitante()">

                    </div>

                </div>


                <div
                    id="estado"
                    class="alert alert-success text-center mt-4">

                    Partido en juego

                </div>


                <hr>


                <!-- ATAJOS -->

                <h5>Atajos de teclado</h5>

                <p>

                    <strong>Q</strong> = + Local |

                    <strong>A</strong> = - Local |

                    <strong>P</strong> = + Visitante |

                    <strong>L</strong> = - Visitante |

                    <strong>I</strong> = Invertir |

                    <strong>F</strong> = Finalizar |

                    <strong>R</strong> = Reiniciar

                </p>

            </div>
        </div>

    </div>


    <script>

        // VARIABLES

        let puntosLocal = 0;
        let puntosVisitante = 0;

        let partidoFinalizado = false;


        // ELEMENTOS DEL HTML

        let puntajeLocal =
            document.getElementById("puntajeLocal");

        let puntajeVisitante =
            document.getElementById("puntajeVisitante");

        let nombreLocal =
            document.getElementById("nombreLocal");

        let nombreVisitante =
            document.getElementById("nombreVisitante");

        let estado =
            document.getElementById("estado");

        let btnInvertir =
            document.getElementById("btnInvertir");


        // =========================
        // ACTUALIZAR TABLERO
        // =========================

        function actualizarTablero() {

            puntajeLocal.textContent = puntosLocal;

            puntajeVisitante.textContent = puntosVisitante;

        }


        // =========================
        // SUMAR LOCAL
        // =========================

        function sumarLocal() {

            if (partidoFinalizado == false) {

                puntosLocal++;

                actualizarTablero();

            }

        }


        // =========================
        // RESTAR LOCAL
        // =========================

        function restarLocal() {

            if (partidoFinalizado == false &&
                puntosLocal > 0) {

                puntosLocal--;

                actualizarTablero();

            }

        }


        // =========================
        // SUMAR VISITANTE
        // =========================

        function sumarVisitante() {

            if (partidoFinalizado == false) {

                puntosVisitante++;

                actualizarTablero();

            }

        }


        // =========================
        // RESTAR VISITANTE
        // =========================

        function restarVisitante() {

            if (partidoFinalizado == false &&
                puntosVisitante > 0) {

                puntosVisitante--;

                actualizarTablero();

            }

        }


        // =========================
        // INVERTIR PUNTAJE
        // =========================

        function invertirPuntaje() {

            if (partidoFinalizado == false) {

                let auxiliar = puntosLocal;

                puntosLocal = puntosVisitante;

                puntosVisitante = auxiliar;

                actualizarTablero();

            }

        }


        // =========================
        // FINALIZAR PARTIDO
        // =========================

        function finalizarPartido() {

            partidoFinalizado = true;

            btnInvertir.disabled = true;

            estado.textContent =
                "Partido finalizado";

            estado.className =
                "alert alert-danger text-center mt-4";

        }


        // =========================
        // REINICIAR
        // =========================

        function reiniciar() {

            puntosLocal = 0;

            puntosVisitante = 0;

            partidoFinalizado = false;

            actualizarTablero();

            btnInvertir.disabled = false;

            estado.textContent =
                "Partido en juego";

            estado.className =
                "alert alert-success text-center mt-4";

        }


        // =========================
        // CAMBIAR NOMBRE LOCAL
        // =========================

        function cambiarNombreLocal() {

            let input =
                document.getElementById("inputLocal");

            if (input.value != "") {

                nombreLocal.textContent =
                    input.value;

            } else {

                nombreLocal.textContent =
                    "Local";

            }

        }


        // =========================
        // CAMBIAR NOMBRE VISITANTE
        // =========================

        function cambiarNombreVisitante() {

            let input =
                document.getElementById("inputVisitante");

            if (input.value != "") {

                nombreVisitante.textContent =
                    input.value;

            } else {

                nombreVisitante.textContent =
                    "Visitante";

            }

        }


        // =========================
        // CAMBIAR COLOR LOCAL
        // =========================

        function cambiarColorLocal() {

            let color =
                document.getElementById("colorLocal");

            puntajeLocal.style.color =
                color.value;

            nombreLocal.style.color =
                color.value;

        }


        // =========================
        // CAMBIAR COLOR VISITANTE
        // =========================

        function cambiarColorVisitante() {

            let color =
                document.getElementById("colorVisitante");

            puntajeVisitante.style.color =
                color.value;

            nombreVisitante.style.color =
                color.value;

        }


        // =========================
        // ATAJOS DE TECLADO
        // =========================

        document.addEventListener("keydown", function(evento) {

            if (evento.target.tagName == "INPUT") {
                return;
            }


            let tecla = evento.key.toLowerCase();


            if (tecla == "q") {
                sumarLocal();
            }


            if (tecla == "a") {
                restarLocal();
            }


            if (tecla == "p") {
                sumarVisitante();
            }


            if (tecla == "l") {
                restarVisitante();
            }


            if (tecla == "i") {
                invertirPuntaje();
            }


            if (tecla == "f") {
                finalizarPartido();
            }


            if (tecla == "r") {
                reiniciar();
            }

        });

    </script>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
