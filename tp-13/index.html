<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        .producto-comprado {
            text-decoration: line-through;
            color: #6c757d;
        }
        #lista-productos li {
            transition: background-color .15s ease-in-out;
        }
        .btn-icono {
            padding: 0.15rem 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>
        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h2 class="mb-0">Listado de Productos</h2>
                    <div class="btn-group">
                        <button type="button" id="btn-ordenar" class="btn btn-outline-secondary btn-sm">
                            Ordenar A-Z
                        </button>
                        <button type="button" id="btn-limpiar" class="btn btn-outline-danger btn-sm">
                            Limpiar lista
                        </button>
                    </div>
                </div>

                <ul id="lista-productos" class="list-group list-group-flush mt-3">
                    <!-- Los productos se agregan dinámicamente acá -->
                </ul>

                <p id="mensaje-vacio" class="text-muted fst-italic mt-3 mb-0">
                    No hay productos en la lista todavía.
                </p>

                <hr class="hr">

                <h2>Agregar Producto</h2>
                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" aria-label="Nombre del Producto" placeholder="Ej: Leche" required>
                        <button class="btn btn-primary" type="submit">Agregar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        const CLAVE_STORAGE = 'lista-compras-productos';

        const listaProductosEl = document.getElementById('lista-productos');
        const mensajeVacioEl = document.getElementById('mensaje-vacio');

        // Estado en memoria: array de objetos { id, nombre, comprado }
        let productos = [];

        /**
         * Genera un id único simple para cada producto.
         */
        function generarId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        /**
         * Guarda el array "productos" en localStorage.
         */
        function guardarEnStorage() {
            localStorage.setItem(CLAVE_STORAGE, JSON.stringify(productos));
        }

        /**
         * Lee el array de productos desde localStorage (si existe).
         */
        function cargarDeStorage() {
            const datos = localStorage.getItem(CLAVE_STORAGE);
            if (!datos) return [];
            try {
                const parseado = JSON.parse(datos);
                return Array.isArray(parseado) ? parseado : [];
            } catch (error) {
                console.error('No se pudo leer la lista guardada:', error);
                return [];
            }
        }

        /**
         * Muestra u oculta el mensaje de "lista vacía" según corresponda.
         */
        function actualizarMensajeVacio() {
            mensajeVacioEl.classList.toggle('d-none', productos.length > 0);
        }

        /**
         * Crea el elemento <li> correspondiente a un producto y lo devuelve.
         */
        function crearElementoProducto(producto) {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex align-items-center gap-2';
            li.dataset.id = producto.id;

            // Checkbox "comprado"
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'form-check-input mt-0 flex-shrink-0';
            checkbox.checked = producto.comprado;
            checkbox.setAttribute('aria-label', `Marcar ${producto.nombre} como comprado`);
            checkbox.addEventListener('change', () => alternarComprado(producto.id));

            // Texto del producto
            const span = document.createElement('span');
            span.className = 'flex-grow-1 texto-producto';
            span.textContent = producto.nombre;
            if (producto.comprado) {
                span.classList.add('producto-comprado');
            }

            // Botón editar
            const btnEditar = document.createElement('button');
            btnEditar.type = 'button';
            btnEditar.className = 'btn btn-sm btn-outline-secondary btn-icono';
            btnEditar.textContent = 'Editar';
            btnEditar.addEventListener('click', () => editarProducto(producto.id, li));

            // Botón eliminar
            const btnEliminar = document.createElement('button');
            btnEliminar.type = 'button';
            btnEliminar.className = 'btn btn-sm btn-outline-danger btn-icono';
            btnEliminar.textContent = 'Eliminar';
            btnEliminar.addEventListener('click', () => eliminarProducto(producto.id));

            li.append(checkbox, span, btnEditar, btnEliminar);
            return li;
        }

        /**
         * Vuelve a dibujar toda la lista en el DOM a partir del array "productos".
         */
        function renderizarLista() {
            listaProductosEl.innerHTML = '';
            productos.forEach((producto) => {
                listaProductosEl.appendChild(crearElementoProducto(producto));
            });
            actualizarMensajeVacio();
        }

        /**
         * agregarProducto()
         * esta función se va a llamar cuando el usuario envía el formulario con el nombre del producto para agregar.
         */
        function agregarProducto(nombreProducto) {
            const nombre = nombreProducto.trim();
            if (!nombre) return;

            const nuevoProducto = {
                id: generarId(),
                nombre: nombre,
                comprado: false
            };

            productos.push(nuevoProducto);
            guardarEnStorage();
            renderizarLista();
        }

        /**
         * Elimina un producto individual según su id.
         */
        function eliminarProducto(id) {
            productos = productos.filter((producto) => producto.id !== id);
            guardarEnStorage();
            renderizarLista();
        }

        /**
         * Marca/desmarca un producto como comprado.
         */
        function alternarComprado(id) {
            const producto = productos.find((producto) => producto.id === id);
            if (!producto) return;
            producto.comprado = !producto.comprado;
            guardarEnStorage();
            renderizarLista();
        }

        /**
         * Habilita la edición del nombre de un producto: reemplaza el texto
         * por un input y permite confirmar con Enter/blur o cancelar con Escape.
         */
        function editarProducto(id, li) {
            const producto = productos.find((producto) => producto.id === id);
            if (!producto) return;

            const span = li.querySelector('.texto-producto');
            const inputEdicion = document.createElement('input');
            inputEdicion.type = 'text';
            inputEdicion.className = 'form-control form-control-sm flex-grow-1';
            inputEdicion.value = producto.nombre;

            span.replaceWith(inputEdicion);
            inputEdicion.focus();
            inputEdicion.select();

            let confirmado = false;

            function confirmarEdicion() {
                if (confirmado) return;
                confirmado = true;
                const nuevoNombre = inputEdicion.value.trim();
                producto.nombre = nuevoNombre || producto.nombre;
                guardarEnStorage();
                renderizarLista();
            }

            inputEdicion.addEventListener('blur', confirmarEdicion);
            inputEdicion.addEventListener('keydown', (evento) => {
                if (evento.key === 'Enter') {
                    evento.preventDefault();
                    confirmarEdicion();
                } else if (evento.key === 'Escape') {
                    confirmado = true;
                    renderizarLista();
                }
            });
        }

        /**
         * Ordena la lista de productos alfabéticamente (A-Z).
         */
        function ordenarProductos() {
            productos.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' }));
            guardarEnStorage();
            renderizarLista();
        }

        /**
         * Borra todos los productos de la lista.
         */
        function limpiarLista() {
            if (productos.length === 0) return;
            const confirmar = confirm('¿Seguro que querés borrar todos los productos de la lista?');
            if (!confirmar) return;
            productos = [];
            guardarEnStorage();
            renderizarLista();
        }

        function handlerFormulario(evento) {
            evento.preventDefault();
            const input = evento.target.querySelector('input');
            const nombreProducto = input.value;
            input.value = "";
            agregarProducto(nombreProducto);
            input.focus();
        }

        document.getElementById('form-producto').addEventListener('submit', handlerFormulario);
        document.getElementById('btn-ordenar').addEventListener('click', ordenarProductos);
        document.getElementById('btn-limpiar').addEventListener('click', limpiarLista);

        // Inicialización: cargar productos guardados (o el "Pan" inicial si no hay nada guardado)
        productos = cargarDeStorage();
        if (productos.length === 0) {
            productos = [{ id: generarId(), nombre: 'Pan', comprado: false }];
            guardarEnStorage();
        }
        renderizarLista();
    </script>
</body>
</html>
