<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéDex - TP 16</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Estilos propios -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <!-- Barra de Navegación -->
  <nav class="navbar navbar-dark bg-danger mb-4 shadow-sm">
    <div class="container">
      <span class="navbar-brand mb-0 h1 fw-bold">PokéDex - TP 16</span>
    </div>
  </nav>

  <!-- Contenedor Principal -->
  <div class="container">
    
    <div class="text-center mb-4">
      <h1 class="text-danger fw-bold">PokéDex</h1>
      <p class="text-muted">Listado de los primeros 151 Pokémon originales</p>
    </div>

    <!-- Spinner de Carga (Power Up) -->
    <div id="spinner" class="text-center my-5">
      <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-2 text-muted fw-semibold">Cargando Pokémon desde la PokéAPI...</p>
    </div>

    <!-- Grilla de cartas responsiva con Bootstrap (Power Up) -->
    <div id="lista-pokemon" class="row g-4">
      <!-- Acá se agregan las cartas dinámicamente con JS -->
    </div>

    <!-- Botón Cargar Más (Power Up) -->
    <div class="text-center my-5">
      <button id="btn-cargar-mas" class="btn btn-danger btn-lg px-4 shadow" style="display: none;">
        Cargar más Pokémon
      </button>
    </div>

  </div>

  <!-- Modal de Bootstrap para ver la información adicional -->
  <div class="modal fade" id="modal-pokemon" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        
        <!-- Encabezado del modal -->
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title fw-bold" id="modal-nombre">Nombre Pokémon</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <!-- Cuerpo del modal -->
        <div class="modal-body text-center">
          <!-- Foto del pokemon -->
          <img id="modal-foto" src="" alt="Foto Pokémon" class="img-fluid my-2" style="max-height: 170px;">
          
          <!-- Tipos -->
          <div class="my-2">
            <strong>Tipos:</strong>
            <div id="modal-tipos" class="mt-1"></div>
          </div>

          <!-- Altura y Peso -->
          <div class="row my-3 bg-light p-2 rounded border mx-1">
            <div class="col-6">
              <small class="text-muted">Altura:</small>
              <div id="modal-altura" class="fw-bold">-</div>
            </div>
            <div class="col-6">
              <small class="text-muted">Peso:</small>
              <div id="modal-peso" class="fw-bold">-</div>
            </div>
          </div>

          <!-- Habilidades (al menos una habilidad) -->
          <div class="text-start my-2">
            <strong>Habilidades:</strong>
            <ul id="modal-habilidades" class="mb-2"></ul>
          </div>

          <!-- Movimientos (al menos cuatro movimientos) -->
          <div class="text-start my-2">
            <strong>Movimientos principales:</strong>
            <div id="modal-movimientos" class="d-flex flex-wrap gap-1 mt-1"></div>
          </div>
        </div>

        <!-- Pie del modal -->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Archivo JavaScript -->
  <script src="script.js"></script>
</body>
</html>
