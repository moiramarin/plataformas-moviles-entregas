<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor de Texto - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Editor de Texto</h1>
        <div class="card">
            <div class="card-body">
                <h2>Texto</h2>

                <p class="texto" id="texto">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum
                    auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce
                    imperdiet nisl nibh, ac aliquet ante elementum vitae.</p>

                <hr class="hr">

                <h2>Opciones de Formato</h2>
                <div class="row">
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-negrita" class="btn d-block w-100 btn-primary" data-formato="negrita">
                            Bold (Negrita)
                        </button>
                    </div>
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-cursiva" class="btn d-block w-100 btn-primary" data-formato="cursiva">
                            Italic (Cursiva)
                        </button>
                    </div>
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-Subrayado" class="btn d-block w-100 btn-primary" data-formato="subrayado">
                            Underline (Subrayado)
                        </button>
                    </div>
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-cambiar-color" class="btn d-block w-100 btn-primary" data-formato="color">
                            cambiar color
                        </button>
                    </div>
                    <div class="col-12 col-md-4 my-1">

                        <button id="cambiar-texto" class="btn d-block w-100 btn-primary" data-formato="cambiar">
                            <input id="nuevoTexto" type="text">
                            cambiar texto
                        </button>
                    </div>
                    <div>
                        <button id="btn-tamaño" class="btn d-block w-100 btn-primary" data-formato="tamaño">
                            Cambiar tamaño
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script type="text/javascript">
        /**
         * funcionNegrita()
         * Esta función se ejecuta cuando el usuario selecciona la opción Bold (negrita).
         */
        function funcionNegrita() {
            let texto = document.querySelector('#texto');
            texto.style.fontWeight = 'bold';
            let boton = document.querySelector('#btn-negrita');
            boton.style.backgroundColor = 'green';
        }

        /**
         * funcionCursiva()
         * Esta función se ejecuta cuando el usuario selecciona la opción Italic (cursiva).
         */
        function funcionCursiva() {
            let texto = document.querySelector('#texto');
            texto.style.fontStyle = 'italic';
            let boton = document.querySelector('#btn-cursiva');
            boton.style.backgroundColor = 'brown';
        }

        /**
         * funcionSubrayado()
         * Esta función se ejecuta cuando el usuario selecciona la opción Underline (subrayado).
         */
        function funcionSubrayado() {
            let texto = document.querySelector('#texto');
            texto.style.textDecoration = 'underline';
            let boton = document.querySelector('#btn-Subrayado');
            boton.style.backgroundColor = 'yellow';
        }
        function funcionCambiarColor() {
            let texto = document.querySelector('#texto');
            texto.style.color = 'red';
            let boton = document.querySelector('#btn-cambiar-color');
            boton.style.backgroundColor = 'black';
        }
        function funcioncambiarTexto() {
            let texto = document.querySelector('#texto');
            let nuevoTexto = document.querySelector('#nuevoTexto');
            texto.innerText = nuevoTexto.value;
        }
        function funcionTamaño() {
            let texto = document.querySelector('#texto');
            texto.style.fontSize = '30px';
        }

        function handlerBoton(e) {
            // Obtiene el valor del atributo "data-formato" del botón que disparó el evento
            const funcionBoton = e.target.dataset.formato;
            switch (funcionBoton) {
                case 'negrita':
                    funcionNegrita();
                    break;
                case 'cursiva':
                    funcionCursiva();
                    break;
                case 'subrayado':
                    funcionSubrayado();
                    break;
                case 'color':
                    funcionCambiarColor();
                    break;
                case 'cambiar':
                    funcioncambiarTexto();
                    break;
                case 'tamaño':
                    funcionTamaño();
                    break;
            }
        }
        document.querySelectorAll('button.btn').forEach(e => e.addEventListener('click', handlerBoton));
    </script>
</body>

</html>
